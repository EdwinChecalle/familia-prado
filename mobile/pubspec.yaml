name: familia_prado
description: Aplicación móvil privada para la organización de Familia Prado.
publish_to: none
version: 0.3.2+4
environment:
  sdk: '>=3.5.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  http: ^1.5.0
  flutter_secure_storage: ^9.2.4
  flutter_tts: ^4.2.5
  shared_preferences: ^2.5.3
  file_picker: 10.3.10
  path_provider: ^2.1.6
  open_filex: ^5.0.0
  flutter_local_notifications: ^23.0.2
  timezone: ^0.11.2
  firebase_core: 5.2.0
  firebase_messaging: 17.1.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
flutter:
  uses-material-design: true
