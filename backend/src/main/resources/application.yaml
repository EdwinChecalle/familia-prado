server:
  port: ${PORT:8080}
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/familia_prado}
    username: ${DB_USER:prado_app}
    password: ${DB_PASSWORD:}
  flyway:
    enabled: true
  jackson:
    time-zone: UTC
management:
  endpoints:
    web:
      exposure:
        include: health
logging:
  level:
    org.springframework.security: WARN
